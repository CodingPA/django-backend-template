[project]
name = "django-backend-template"
version = "0.1.0"
description = "Reusable Django backend: Channels, Celery, allauth (Google + email), feature-flagged signup."
requires-python = ">=3.12"
dependencies = [
    "django>=5.2,<6.0",
    "djangorestframework>=3.15",
    "django-environ>=0.12",
    "django-cors-headers>=4.7",
    "drf-spectacular>=0.28",
    "django-allauth[socialaccount]>=65.4",
    "channels[daphne]>=4.2",
    "channels-redis>=4.2",
    "celery[redis]>=5.4",
    "django-celery-beat>=2.7",
    "redis>=5.2",
    "psycopg[binary]>=3.2",
    "whitenoise>=6.8",
    "uvicorn[standard]>=0.34",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-django>=4.9",
    "pytest-asyncio>=0.25",
    "ruff>=0.9",
]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["*/migrations/*"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "DJ"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
python_files = ["test_*.py", "tests.py"]
asyncio_mode = "auto"
