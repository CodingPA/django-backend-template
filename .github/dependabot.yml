version: 2

# Docker images are deliberately not tracked. The tags float within a series
# (python:3.12-slim, postgres:16-alpine, redis:7-alpine), so a rebuild already
# picks up patches; every PR Dependabot could open would be a series jump that
# CI never builds or tests.

updates:
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    groups:
      python-minor-and-patch:
        patterns: ["*"]
        update-types: [minor, patch]
    ignore:
      # 5.2 is the LTS this template targets (pyproject pins <6.0). Moving to
      # 6.x is a deliberate upgrade, not a weekly bump.
      - dependency-name: django
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
